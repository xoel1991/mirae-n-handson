# 테스트 프로필: H2(MariaDB 모드) 인메모리. `./gradlew test` 는 DB 컨테이너 없이 통과한다.
spring:
  datasource:
    url: jdbc:h2:mem:itembank;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      maximum-pool-size: 2
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false

logging:
  level:
    root: WARN
    com.example: INFO
